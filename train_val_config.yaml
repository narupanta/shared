# Dataset config
material_model_name: neohookean
disp_noise: 0.0001
load_noise: 0.01
target_load_true_top: 1.6
asym_factor: 0.9
n_loadsteps: 10

# Training config
number_of_mci_sampling: 5
train_load_steps_indices: [1, 5, 9]
n_ip: 5
beta: 50
is_fixed_reaction_force_noise: 1
is_include_prior_mean: 1
n_iterations: 50000
learning_rate: 1e-2

# Validation config
val_load_steps_indices: [9]
number_samples: 1024
