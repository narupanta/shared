# ==============================================================================
# Pipeline Configuration for Synthetic Data -> Extraction -> Distillation -> FEM
# ==============================================================================

# 1. Synthetic Dataset Generation Config
material_model_name: nh4
disp_noise: 0.0001
load_noise: 0.01
target_load_true_top: 1.8
asym_factor: 0.95
n_loadsteps: 10

# 2. UGP Extraction (Training) Config
number_of_mci_sampling: 8
train_load_steps_indices: [1, 5, 9]
n_ip: 5
beta: 80
is_fixed_reaction_force_noise: 1
is_include_prior_mean: 0
extraction_n_iterations: 100
extraction_learning_rate: 0.01

# 3. Distillation (Uncertainty-Aware Model Discovery) Config
distilled_material_model: gmr
distillation_n_iterations: 5
distill_target: sef                 # Options: sef, sef_stress, sef_cauchy
sample_mode: standard_interp              # Options: standard, standard_interp, dataset_f, dataset_all
num_points: 192                     # Number of evaluation points for GP posterior sampling
max_gamma: 1.0                      # Max deformation intensity gamma when sample_mode is standard
do_sensitivity: 1                   # 1 to perform Sobol sensitivity analysis, 0 to skip (--no_sensitivity)
sobol_threshold: 0.001
sobol_samples_factor: 1024

# 4. Stochastic Forward Sampling (Validation with Distilled Model) Config
run_validation: 0                   # Set to 1 to run Step 4 validation, 0 to skip
val_load_steps_indices: [9]
val_number_samples: 1024

